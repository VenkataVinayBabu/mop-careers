# AWS Amplify Hosting build settings for the React frontend.
#
# Amplify reads this from the repository root, so the build does not have to be
# configured by hand in the console.
#
# VITE_API_URL is NOT set here. It is the App Runner URL, it differs per
# environment, and it is BAKED INTO THE BUNDLE AT BUILD TIME — set it in the
# Amplify console under Environment variables, and remember that changing it
# there does nothing until the frontend is rebuilt. That has already caught
# this project out once; see CLAUDE.md thread 3.
version: 1

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Relative to the repo root, not to the directory the build ran in.
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

# SPA routing is NOT configured here — Amplify does it in the console, under
# App settings > Rewrites and redirects. Add this rule after the first deploy,
# or refreshing on /about or /programs/data-analytics-with-ai returns a 404:
#
#   Source:  </^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|xml|webmanifest)$)([^.]+$)/>
#   Target:  /index.html
#   Type:    200 (Rewrite)
#
# The pattern deliberately excludes real file extensions, so a missing image
# still 404s rather than silently returning the HTML page with a 200.
#
# EVERY extension the site actually serves must be in that list. An earlier
# version of this comment omitted `xml`, which would have quietly rewritten
# /sitemap.xml to index.html — Google would have fetched the sitemap, been
# handed a web page, and indexed nothing. Same trap for the fonts and the
# source maps. If a static file starts returning HTML, this list is why.
