<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MOP Careers — live, mentor-led career programmes in software, data and AI, with placement support throughout."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1E46" />
    <title>MOP Careers — Your Future. Our Priority.</title>

    <!--
      Social preview defaults.

      These are deliberately in the served HTML rather than set by the app.
      WhatsApp, LinkedIn, Slack and X do not run JavaScript when they build a
      link preview -- they read this file as delivered. Without these tags a
      shared link showed no card at all, which for a business whose sharing
      happens on WhatsApp is a real loss.

      They are per-SITE, not per-page: every link previews with this title and
      image. useSeo.js overrides them in the browser, which Google honours and
      the preview crawlers never see. Per-page previews need prerendering at
      build time -- see CLAUDE.md.

      og:image must be an ABSOLUTE url; crawlers do not resolve relative paths.
      Update the domain here if the canonical site ever moves off the .com.
    -->
    <link rel="canonical" href="https://mopcareers.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOP Careers" />
    <meta property="og:url" content="https://mopcareers.com/" />
    <meta property="og:title" content="MOP Careers — Your Future. Our Priority." />
    <meta
      property="og:description"
      content="Live, mentor-led career programmes in software, data and AI, with placement support throughout. Pay after you're placed."
    />
    <meta property="og:image" content="https://mopcareers.com/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MOP Careers — Your Future. Our Priority." />
    <meta
      name="twitter:description"
      content="Live, mentor-led career programmes in software, data and AI, with placement support throughout. Pay after you're placed."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
