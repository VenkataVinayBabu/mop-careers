<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MOP Careers — live, mentor-led career programmes in software, data and AI, with placement support throughout."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1E46" />
    <title>MOP Careers — Your Future. Our Priority.</title>

    <!--
      Social preview defaults.

      These are deliberately in the served HTML rather than set by the app.
      WhatsApp, LinkedIn, Slack and X do not run JavaScript when they build a
      link preview -- they read this file as delivered. Without these tags a
      shared link showed no card at all, which for a business whose sharing
      happens on WhatsApp is a real loss.

      They are per-SITE, not per-page: every link previews with this title and
      image. useSeo.js overrides them in the browser, which Google honours and
      the preview crawlers never see. Per-page previews need prerendering at
      build time -- see CLAUDE.md.

      og:image must be an ABSOLUTE url; crawlers do not resolve relative paths.
      Update the domain here if the canonical site ever moves off the .com.
    -->
    <link rel="canonical" href="https://mopcareers.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOP Careers" />
    <meta property="og:url" content="https://mopcareers.com/" />
    <meta property="og:title" content="MOP Careers — Your Future. Our Priority." />
    <meta
      property="og:description"
      content="Live, mentor-led career programmes in software, data and AI, with placement support throughout. Pay after you're placed."
    />
    <!--
      1200x630, generated by scripts/make-og-image.py. The size is what makes
      a shared link render as a full-width card; this pointed at the 180px
      apple-touch-icon until 7 Sep 2026, which every platform rendered as a
      tiny thumbnail beside the URL. WhatsApp is the sharing channel that
      matters most here, and it is the strictest about the dimensions.
      og:image:width/height let a crawler lay the card out before the image
      has finished downloading, which is what stops the first share of a
      cold URL falling back to no preview at all.
    -->
    <meta property="og:image" content="https://mopcareers.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MOP Careers — learn now, pay after you're placed." />
    <!-- summary_large_image, not summary: `summary` is the small square card
         and would waste the 1200x630 image above. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mopcareers.com/og-card.png" />
    <meta name="twitter:title" content="MOP Careers — Your Future. Our Priority." />
    <meta
      name="twitter:description"
      content="Live, mentor-led career programmes in software, data and AI, with placement support throughout. Pay after you're placed."
    />
    <!--
      Site-wide structured data. STATIC, not injected by the app: this is
      true on every page, and a crawler that never runs the JavaScript
      should still get it. Per-page markup (Course, breadcrumbs) is added
      by src/hooks/useSeo.js instead.

      The address and phone must match what the footer prints and what the
      Google Business Profile says. Google cross-checks the three, and a
      mismatch is worse than an omission -- it is the signal that decides
      whether a local business result is trusted. Update all three together.

      No sameAs yet: it lists the brand's social profiles, and MOP has not
      supplied the five URLs (see CLAUDE.md). Add it when they arrive --
      it is one of the stronger signals for tying a new domain to a known
      brand, which is exactly this site's problem against the .in and .co.in.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "MOP Careers",
        "legalName": "MOP CAREERS SOFTWARE SERVICES PVT LTD",
        "url": "https://mopcareers.com",
        "logo": "https://mopcareers.com/og-card.png",
        "description": "Live, mentor-led career programmes in software, data and AI, with placement support throughout.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ground Floor, No. 10, 14th Main, 5th Sector, HSR Layout",
          "addressLocality": "Bengaluru",
          "addressRegion": "Karnataka",
          "postalCode": "560102",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-98908-13235",
          "contactType": "admissions",
          "areaServed": "IN",
          "availableLanguage": [
            "en",
            "hi",
            "kn",
            "te"
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
